name: tests
on: [push, pull_request]
jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m okx_bot paper --bars 320 --state-dir .runtime-ci
  windows-launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify launcher in Windows PowerShell with a fake WSL process
        shell: powershell
        run: |
          try {
            .\tests\test_launcher_windows.ps1
          } catch {
            # The test uses only fake WSL/proxy data. Publish its controlled
            # diagnostic as an annotation; never upload user credentials/logs.
            $detail = $_.Exception.Message + "`n" + $_.InvocationInfo.PositionMessage
            $message = $detail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error title=Windows launcher integration::$message"
            exit 1
          }
      - name: Verify backtest launcher with a fake WSL process
        shell: powershell
        run: |
          try {
            .\tests\test_backtest_launcher_windows.ps1
          } catch {
            $detail = $_.Exception.Message + "`n" + $_.InvocationInfo.PositionMessage
            $message = $detail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error title=Windows backtest launcher integration::$message"
            exit 1
          }
      - name: Verify read-only demo monitor launcher with a fake WSL process
        shell: powershell
        run: |
          try {
            .\tests\test_monitor_launcher_windows.ps1
          } catch {
            $detail = $_.Exception.Message + "`n" + $_.InvocationInfo.PositionMessage
            $message = $detail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error title=Windows monitor launcher integration::$message"
            exit 1
          }
      - name: Verify public-network diagnostic launcher with a fake WSL process
        shell: powershell
        run: |
          try {
            .\tests\test_diagnose_launcher_windows.ps1
          } catch {
            $detail = $_.Exception.Message + "`n" + $_.InvocationInfo.PositionMessage
            $message = $detail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error title=Windows diagnostic launcher integration::$message"
            exit 1
          }
      - name: Verify portfolio demo launcher with a fake WSL process
        shell: powershell
        run: |
          try {
            .\tests\test_portfolio_launcher_windows.ps1
          } catch {
            $detail = $_.Exception.Message + "`n" + $_.InvocationInfo.PositionMessage
            $message = $detail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error title=Windows portfolio launcher integration::$message"
            exit 1
          }
