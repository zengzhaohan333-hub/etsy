[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "okx-demo-bot"
version = "0.1.0"
description = "Local paper trading and demo-only OKX USDT perpetual bot"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
okx-bot = "okx_bot.__main__:main"

[tool.setuptools.package-data]
okx_bot = ["dashboard.html", "monitor.html"]
